<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seedance Studio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== Topbar ===== -->
  <div id="topbar">
    <div class="topbar-brand">
      <svg class="brand-logo" width="24" height="24" viewBox="0 0 24 24" fill="none">
        <rect width="24" height="24" rx="6" fill="#6c5ce7"/>
        <path d="M7 12l3 3 7-7" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Seedance Studio</span>
    </div>

    <div class="topbar-key-group">
      <label for="apiKeyInput">API Key</label>
      <input type="password" id="apiKeyInput" placeholder="sk-or-..." />
    </div>

    <div class="topbar-key-group">
      <label for="openrouterKeyInput">OpenRouter</label>
      <input type="password" id="openrouterKeyInput" placeholder="sk-or-..." />
    </div>

    <div class="topbar-spacer"></div>

    <button class="topbar-btn topbar-btn-secondary" id="resetViewBtn" title="Reset canvas view">Reset View</button>
    <button class="topbar-btn topbar-btn-primary" id="runBtn">Run</button>
  </div>

  <!-- ===== Sidebar ===== -->
  <div id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">Node Palette</div>

      <div class="palette-category">Input</div>
      <div class="palette-item" draggable="true" data-node-type="upload">
        <span class="palette-icon">&#128228;</span>
        <span class="palette-label">Image Upload</span>
      </div>

      <div class="palette-category">Processing</div>
      <div class="palette-item" draggable="true" data-node-type="image">
        <span class="palette-icon">&#128444;</span>
        <span class="palette-label">Image to Video</span>
      </div>
      <div class="palette-item" draggable="true" data-node-type="video">
        <span class="palette-icon">&#127916;</span>
        <span class="palette-label">Text to Video</span>
      </div>

      <div class="palette-category">Output</div>
      <div class="palette-item" draggable="true" data-node-type="preview">
        <span class="palette-icon">&#128065;</span>
        <span class="palette-label">Preview</span>
      </div>
    </div>

    <!-- Settings panel (shown when a node is selected) -->
    <div class="sidebar-section hidden" id="nodeSettings">
      <div class="sidebar-title">
        <button class="back-btn" id="settingsBackBtn">&larr;</button>
        Node Settings
      </div>
      <!-- Dynamic settings content will be injected here -->
      <div id="nodeSettingsContent"></div>
    </div>
  </div>

  <!-- ===== Canvas Viewport ===== -->
  <div id="canvasWrapper">
    <!-- Transform layer for nodes -->
    <div id="canvas"></div>
    <!-- SVG overlay for bezier connections -->
    <svg id="connections" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <!-- ===== Hidden file input ===== -->
  <input type="file" id="globalFileInput" class="hidden" />

  <!-- ===== Log Panel ===== -->
  <div id="logPanel">
    <button class="log-toggle">
      <span>Log Output</span>
      <span class="toggle-arrow">&#9660;</span>
    </button>
    <div class="log-content">
      <div class="log-entry">
        <span class="log-time">[System]</span> Seedance Studio ready.
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
